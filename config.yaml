data:
  dataset_dir: data/raw
  primary_dataset: null # Null = automatically select the first market CSV found.
  date_column: Date
  close_column: Close
  database: data/qeti.sqlite3
splits: {train: 0.70, validation: 0.15, test: 0.15}
validation: {walk_forward_folds: 5}
features: {window_size: 20, horizon_days: 10, crash_threshold: -0.05, warning_threshold: -0.03, purge_gap: 30, tda_feature_mode: reduced}
models:
  random_seed: 42
  enable_tda: true
  tda_stride: 20 # Compute PH every 20 overlapping windows; forward-fill topological state.
  tda_state_features: [daily_return, volatility_20, drawdown, momentum_10, cross_nasdaq_return, cross_dow_return, cross_nifty_return, cross_vix_return, cross_btc_return, cross_eth_return, cross_nasdaq_correlation_60, cross_dow_correlation_60, cross_nifty_correlation_60]
  fast_mode: true
  enable_xgboost: true
  enable_lstm: true
  enable_vqc: true
  vqc: {n_qubits: 2, n_layers: 1, iterations: 15, batch_size: 32, max_samples: 384, learning_rate: 0.15, perturbation: 0.1}
  rf: {n_estimators: 300, max_depth: 8, min_samples_leaf: 3}
risk_thresholds: [0.25, 0.50, 0.75] # Prototype thresholds; not scientifically validated.
outputs: {root: outputs, figures: outputs/figures, metrics: outputs/metrics, predictions: outputs/predictions, reports: outputs/reports, models: outputs/models}
